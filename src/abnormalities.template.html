<script>
/*__SHARED_JS__*/
const DATA = __DATA__;
const GENES = __GENES__;
const BPGENES = __BPGENES__;   // fusion partners of the example rearrangements
/*__SCOPE_JS__*/
const ORDER = SITE.ORDER, TOTAL1 = DATA["1"]["850"].at(-1)[2];
const NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const MINUS="–";

// ================= chromosome geometry (genomic coordinates) =================
const Lbp = c => DATA[c]["850"].at(-1)[4];
const cenBp = c => DATA[c]["550"].find(b=>b[0].startsWith("q"))[3];
const armOf = (c,bp) => bp < cenBp(c) ? "p" : "q";
function isChild(child,parent){
  if(child===parent || child.startsWith(parent+".")) return true;
  return parent.includes(".") && child.startsWith(parent) && /^\d+$/.test(child.slice(parent.length));
}
// Resolve a typed band name to a genomic interval; the break sits at its midpoint.
function resolveBand(c,name){
  if(!DATA[c]) return null;
  if(name==="p10"||name==="q10"){ const m=cenBp(c); return {name,s:m,e:m,mid:m}; }
  for(const lv of ["550","400","850"]){ const b=DATA[c][lv].find(x=>x[0]===name); if(b) return {name,s:b[3],e:b[4],mid:(b[3]+b[4])/2}; }
  for(const lv of ["850","550","400"]){
    const kids=DATA[c][lv].filter(x=>isChild(x[0],name));
    if(kids.length){ const s=Math.min(...kids.map(k=>k[3])), e=Math.max(...kids.map(k=>k[4])); return {name,s,e,mid:(s+e)/2}; }
  }
  return null;
}
function bandAt(c,lv,bp){ const bs=DATA[c][lv]; return bs.find(b=>bp>=b[3]&&bp<=b[4]) || (bp<bs[0][3]?bs[0]:bs.at(-1)); }
const bp = (c,name) => resolveBand(c,name);

// ================= abnormalities → derivative chromosomes =================
// A chromosome is a list of segments {c, s, e} in genomic coordinates, read pter→qter; s>e means inverted.
const SEG=(c,s,e)=>({c,s,e});
function distal(c,b){ return armOf(c,b.mid)==="p" ? SEG(c,b.mid,0) : SEG(c,b.mid,Lbp(c)); }
function rev(seg){ return {...seg,s:seg.e,e:seg.s}; }
function derOf(A,a,B,b){
  if(armOf(A,a.mid)==="q") return [SEG(A,0,a.mid), distal(B,b)];
  return [rev(distal(B,b)), SEG(A,a.mid,Lbp(A))];
}
function chromosomesFor(it){
  const c=it.c, L=Lbp(c||"1");
  switch(it.type){
    case "t":   return [{c:it.a,label:`der(${it.a})`,segs:derOf(it.a,it.ba,it.b,it.bb)},{c:it.b,label:`der(${it.b})`,segs:derOf(it.b,it.bb,it.a,it.ba)}];
    case "der": return [{c:it.a,label:`der(${it.a})`,segs:derOf(it.a,it.ba,it.b,it.bb)}];
    case "del": if(!it.b2) return [{c,label:`del(${c})`,segs: armOf(c,it.b1.mid)==="q" ? [SEG(c,0,it.b1.mid)] : [SEG(c,it.b1.mid,L)]}];
                return [{c,label:`del(${c})`,segs:[SEG(c,0,it.b1.mid),SEG(c,it.b2.mid,L)]}];
    case "dup": return [{c,label:`dup(${c})`,segs:[SEG(c,0,it.b2.mid),SEG(c,it.b1.mid,L)]}];
    case "inv": return [{c,label:`inv(${c})`,segs:[SEG(c,0,it.b1.mid),SEG(c,it.b2.mid,it.b1.mid),SEG(c,it.b2.mid,L)]}];
    case "i":   { const m=cenBp(c); return [{c,label:`i(${c})`,segs: it.arm==="q" ? [SEG(c,L,m),SEG(c,m,L)] : [SEG(c,0,m),SEG(c,m,0)]}]; }
    case "r":   return [{c,label:`r(${c})`,ring:true,segs:[SEG(c,it.b1.mid,it.b2.mid)]}];
    case "add": { const lost = armOf(c,it.b1.mid)==="q" ? L-it.b1.mid : it.b1.mid, unk={c:"?",len:lost*0.55};
                  return [{c,label:`add(${c})`,segs: armOf(c,it.b1.mid)==="q" ? [SEG(c,0,it.b1.mid),unk] : [unk,SEG(c,it.b1.mid,L)]}]; }
  }
  return [];
}
function validate(it){
  const needCen=(c,segs)=>segs.some(s=>s.c===c && Math.min(s.s,s.e)<=cenBp(c) && Math.max(s.s,s.e)>=cenBp(c));
  if(it.type==="del" && it.b2 && it.b1.mid<cenBp(it.c) && it.b2.mid>cenBp(it.c)) return "Those two breakpoints would delete the centromere. A deletion must stay within one arm.";
  if(it.type==="dup" && it.b1.mid<cenBp(it.c) && it.b2.mid>cenBp(it.c)) return "A duplication across the centromere would make a dicentric chromosome, which this tool does not draw.";
  if(it.type==="r" && !(it.b1.mid<cenBp(it.c) && it.b2.mid>cenBp(it.c))) return "A ring needs one breakpoint on each arm, otherwise it has no centromere.";
  if((it.type==="t"||it.type==="der") && it.a===it.b) return "Pick two different chromosomes for a translocation.";
  if((it.type==="t"||it.type==="der") && (it.a==="Y"&&state.sex==="XX" || it.b==="Y"&&state.sex==="XX")) return "Switch the karyotype to XY to use chromosome Y.";
  if(it.c==="Y" && state.sex==="XX") return "Switch the karyotype to XY to use chromosome Y.";
  return null;
}

// ================= ISCN writing =================
const ck = c => c==="X"?-2 : c==="Y"?-1 : parseInt(c,10);
function shortOf(it){
  const n=(x)=>x.name;
  switch(it.type){
    case "t": { let [A,B,a,b]=[it.a,it.b,it.ba,it.bb]; if(ck(B)<ck(A)) [A,B,a,b]=[B,A,b,a]; return `t(${A};${B})(${n(a)};${n(b)})`; }
    case "der": { let [A,B,a,b]=[it.a,it.b,it.ba,it.bb]; if(ck(B)<ck(A)) [A,B,a,b]=[B,A,b,a]; return `der(${it.a})t(${A};${B})(${n(a)};${n(b)})`; }
    case "del": return `del(${it.c})(${n(it.b1)}${it.b2?n(it.b2):""})`;
    case "dup": case "inv": case "r": return `${it.type}(${it.c})(${n(it.b1)}${n(it.b2)})`;
    case "i":   return `i(${it.c})(${it.arm}10)`;
    case "add": return `add(${it.c})(${n(it.b1)})`;
    case "gain": return `+${it.c}`;
    case "loss": return `${MINUS}${it.c}`;
  }
}
function sortKey(it){ const c = it.type==="t" ? [it.a,it.b].sort((x,y)=>ck(x)-ck(y))[0] : (it.a||it.c); return [ck(c), (it.type==="gain"||it.type==="loss")?0:1, it.type]; }
function karyotypeString(){
  const items=[...state.items].sort((x,y)=>{ const a=sortKey(x),b=sortKey(y); return a[0]-b[0]||a[1]-b[1]||(a[2]<b[2]?-1:a[2]>b[2]?1:0); });
  let count=46; const sex={X:state.sex==="XX"?2:1, Y:state.sex==="XY"?1:0};
  const parts=[];
  for(const it of items){
    if(it.type==="gain"){ count++; if(it.c==="X"||it.c==="Y") sex[it.c]++; else parts.push(shortOf(it)); continue; }
    if(it.type==="loss"){ count--; if(it.c==="X"||it.c==="Y") sex[it.c]--; else parts.push(shortOf(it)); continue; }
    for(const ch of involved(it)) if(ch==="X"||ch==="Y") sex[ch]--;   // the abnormal X/Y is written in the abnormality, not the sex complement
    parts.push(shortOf(it));
  }
  const sexStr="X".repeat(Math.max(0,sex.X))+"Y".repeat(Math.max(0,sex.Y));
  return [String(count)].concat(sexStr?[sexStr]:[]).concat(parts).join(",")+(state.cells?`[${state.cells}]`:"");
}
const involved = it => it.type==="t" ? [it.a,it.b] : it.type==="der" ? [it.a] : [it.c];
function endName(c,v,seg,isStart){
  if(v===0) return "pter"; if(v===Lbp(c)) return "qter";
  if(v===cenBp(c)) return (seg && Math.max(seg.s,seg.e)>cenBp(c) ? "q10" : "p10");
  return null;
}
function detailedOf(it){
  const nm=x=>x.name;
  switch(it.type){
    case "t": case "der": {
      const out=[]; const pairs = it.type==="t" ? [[it.a,it.ba,it.b,it.bb],[it.b,it.bb,it.a,it.ba]] : [[it.a,it.ba,it.b,it.bb]];
      for(const [A,a,B,b] of pairs){
        const bTer = armOf(B,b.mid)==="p" ? "pter" : "qter";
        const txt = armOf(A,a.mid)==="q" ? `${A}pter→${A}${nm(a)}::${B}${nm(b)}→${B}${bTer}` : `${B}${bTer}→${B}${nm(b)}::${A}${nm(a)}→${A}qter`;
        out.push([`der(${A})`,txt]);
      }
      return out;
    }
    case "del": if(!it.b2) return [[`del(${it.c})`, armOf(it.c,it.b1.mid)==="q" ? `pter→${nm(it.b1)}:` : `:${nm(it.b1)}→qter`]];
                return [[`del(${it.c})`,`pter→${nm(it.b1)}::${nm(it.b2)}→qter`]];
    case "dup": return [[`dup(${it.c})`,`pter→${nm(it.b2)}::${nm(it.b1)}→qter`]];
    case "inv": return [[`inv(${it.c})`,`pter→${nm(it.b1)}::${nm(it.b2)}→${nm(it.b1)}::${nm(it.b2)}→qter`]];
    case "i":   return [[`i(${it.c})`, it.arm==="q" ? "qter→q10::q10→qter" : "pter→p10::p10→pter"]];
    case "r":   return [[`r(${it.c})`,`::${nm(it.b1)}→${nm(it.b2)}::`]];
    case "add": return [[`add(${it.c})`, armOf(it.c,it.b1.mid)==="q" ? `pter→${nm(it.b1)}::?` : `?::${nm(it.b1)}→qter`]];
  }
  return [];
}
// Landmark genes lying in the breakpoint bands
function genesAtBreaks(){
  const hits=[];
  for(const it of state.items){
    const bs = it.type==="t"||it.type==="der" ? [[it.a,it.ba],[it.b,it.bb]] : [it.b1&&[it.c,it.b1], it.b2&&[it.c,it.b2]].filter(Boolean);
    for(const [c,b] of bs){ for(const g of [...(BPGENES[c]||[]),...(GENES[c]||[])]) if(g.end>=b.s && g.bp<=b.e) hits.push(`<b>${g.n}</b> in ${c}${b.name} (${g.note})`); }
  }
  return [...new Set(hits)];
}

// ================= ISCN parsing =================
const BAND = "([pq]\\d+(?:\\.\\d+)?)";
const CHR = "(\\d{1,2}|X|Y)";
function parseKaryotype(str){
  let s=str.replace(/\s+/g,"").replace(/[−—]/g,"–");
  if(s.includes("/")) return {error:"Mosaics and clone lists (/) are not drawn: enter one clone at a time"};
  let cells=null; const cm=s.match(/\[(\d+)\]$/); if(cm){ cells=+cm[1]; s=s.slice(0,cm.index); }
  const toks=s.split(","); const errors=[]; const items=[];
  if(!/^\d+$/.test(toks[0]||"")) return {error:"Start with the chromosome count, e.g. 46,XY,…"};
  const count=parseInt(toks[0],10); let i=1, sexStr="";
  if(toks[1]!==undefined && /^[XY]*$/.test(toks[1])){ sexStr=toks[1]; i=2; }
  const res=(c,n)=>{ const r=resolveBand(c,n); if(!r) errors.push(`band ${c}${n} not found`); return r; };
  for(;i<toks.length;i++){
    const t=toks[i]; let m;
    if(!t) continue;
    if((m=t.match(new RegExp(`^\\+${CHR}$`)))) { items.push({type:"gain",c:m[1]}); continue; }
    if((m=t.match(new RegExp(`^[–-]${CHR}$`)))) { items.push({type:"loss",c:m[1]}); continue; }
    if((m=t.match(new RegExp(`^t\\(${CHR};${CHR}\\)\\(${BAND};${BAND}\\)$`)))) { const ba=res(m[1],m[3]), bb=res(m[2],m[4]); if(ba&&bb) items.push({type:"t",a:m[1],b:m[2],ba,bb}); continue; }
    if((m=t.match(new RegExp(`^der\\(${CHR}\\)t\\(${CHR};${CHR}\\)\\(${BAND};${BAND}\\)$`)))) {
      const [_,d,x,y,bx,by]=m; if(d!==x&&d!==y){ errors.push(`${t}: der() must name one of the translocated chromosomes`); continue; }
      const other = d===x?y:x, bd=res(d, d===x?bx:by), bo=res(other, d===x?by:bx); if(bd&&bo) items.push({type:"der",a:d,b:other,ba:bd,bb:bo}); continue; }
    if((m=t.match(new RegExp(`^(del|dup|inv|r)\\(${CHR}\\)\\(${BAND}${BAND}?\\)$`)))) {
      const [_,ty,c,x,y]=m; if(ty!=="del" && !y){ errors.push(`${t}: ${ty} needs two breakpoints`); continue; }
      const b1=res(c,x), b2=y?res(c,y):null; if(!b1||(y&&!b2)) continue;
      const it={type:ty,c,b1,b2}; if(b2 && b2.mid<b1.mid){ if(ty==="dup"){ errors.push(`${t}: inverted duplications are not supported`); continue; } it.b1=b2; it.b2=b1; }
      items.push(it); continue; }
    if((m=t.match(new RegExp(`^i\\(${CHR}\\)\\(([pq])10\\)$`)))) { items.push({type:"i",c:m[1],arm:m[2]}); continue; }
    if((m=t.match(new RegExp(`^add\\(${CHR}\\)\\(${BAND}\\)$`)))) { const b1=res(m[1],m[2]); if(b1) items.push({type:"add",c:m[1],b1}); continue; }
    errors.push(`"${t}" is not supported here`);
  }
  if(errors.length) return {error:errors.join("; ")};
  // Rebuild the sex complement: letters in the string plus abnormal X/Y written inside abnormalities
  let nX=(sexStr.match(/X/g)||[]).length, nY=(sexStr.match(/Y/g)||[]).length;
  for(const it of items){ if(it.type==="gain"||it.type==="loss") continue; for(const ch of involved(it)){ if(ch==="X") nX++; if(ch==="Y") nY++; } }
  const sex = nY>0 ? "XY" : "XX";
  const baseX = sex==="XY"?1:2, baseY = sex==="XY"?1:0;
  for(let k=0;k<nX-baseX;k++) items.unshift({type:"gain",c:"X"});
  for(let k=0;k<baseX-nX;k++) items.unshift({type:"loss",c:"X"});
  for(let k=0;k<nY-baseY;k++) items.unshift({type:"gain",c:"Y"});
  const expected=46+items.filter(x=>x.type==="gain").length-items.filter(x=>x.type==="loss").length;
  return {items,sex,count,expected,cells};
}

// ================= state =================
const state={sex:"XY",items:[],cells:null,level:"550",band:SITE.store.get("mode","R")==="G"?"G":"R",view:"idio",seed:1+Math.floor(Math.random()*9999),
  tool:"t", pick:["9","22"], cuts:{}, drag:null};
const TOOLS=[
  {id:"t",   name:"Translocation", hint:"t(A;B)", chroms:2, cuts:[1,1]},

const STAIN_G={gneg:"var(--paper)",gpos25:"var(--g25)",gpos50:"var(--g50)",gpos75:"var(--g75)",gpos100:"var(--ink)",acen:"var(--acen)",gvar:"url(#hatch)",stalk:"var(--stalk)",unknown:"url(#hatchU)"};

const piecesOf=(segs,lv)=>SCOPE.pieces(segs,lv);
function outlinePath(pieces,x,w,top,scale){
  let pos=0; const P=pieces.map(p=>{ const r={...p,y0:pos,y1:pos+p.len}; pos+=p.len; return r; });
  const total=pos, Y=v=>top+v*scale, M=x+w/2, pinch=w*0.28, stalkW=w*0.42;
  const ac=P.filter(p=>p.st==="acen"); const cm = ac.length ? (ac[0].y0+ac.at(-1).y1)/2 : null;
  const pts=[];
  for(const b of P){
    if(b.st==="acen" && cm!==null){ const hw=y=>{ const d=Math.abs(y-cm)/Math.max(1,(ac.at(-1).y1-ac[0].y0)/2); return pinch/2+(w/2-pinch/2)*Math.min(1,d); }; pts.push([b.y0,hw(b.y0)],[b.y1,hw(b.y1)]); if(b.y0<cm&&b.y1>cm) pts.splice(pts.length-1,0,[cm,pinch/2]); }
    else if(b.st==="stalk") pts.push([b.y0,stalkW/2],[b.y1,stalkW/2]);
    else pts.push([b.y0,w/2],[b.y1,w/2]);
  }
  const r=Math.min(w/2,(P[0].y1-P[0].y0)*scale,9), rb=Math.min(w/2,(P.at(-1).y1-P.at(-1).y0)*scale,9);
  const hT=pts[0][1], hB=pts.at(-1)[1], cl=y=>Math.min(Math.max(Y(y),Y(0)+r),Y(total)-rb);
  let d=`M${M-hT},${Y(0)+r} Q${M-hT},${Y(0)} ${M},${Y(0)} Q${M+hT},${Y(0)} ${M+hT},${Y(0)+r}`;
  for(const [y,hw] of pts) d+=` L${M+hw},${cl(y)}`;
  d+=` L${M+hB},${Y(total)-rb} Q${M+hB},${Y(total)} ${M},${Y(total)} Q${M-hB},${Y(total)} ${M-hB},${Y(total)-rb}`;
  for(let i=pts.length-1;i>=0;i--){ const [y,hw]=pts[i]; d+=` L${M-hw},${cl(y)}`; }
  return {d:d+" Z",P,total};
}
let uid=0;

  const u=el("pattern",{id:"hatchU",width:6,height:6,patternUnits:"userSpaceOnUse",patternTransform:"rotate(-45)"},defs);

}
function drawChromo(svg,pieces,x,top,scale,w,opt={}){
  const fill = state.band==="R"?STAIN_R:STAIN_G;

  const id="cl"+(uid++); el("path",{d},el("clipPath",{id},el("defs",{},svg)));
  const g=el("g",{"clip-path":`url(#${id})`},svg);
  for(const b of P){ const r=el("rect",{x,y:top+b.y0*scale,width:w,height:Math.max(0.6,(b.y1-b.y0)*scale),fill:fill[b.st]||"var(--paper)"},g); el("title",{},r).textContent=b.c==="?"?"material of unknown origin":`${b.c}${b.name}`; if(opt.onBand) opt.onBand(r,b); }
  el("path",{d,fill:"none",stroke:"var(--outline)","stroke-width":1.1,"stroke-linejoin":"round"},svg);

    const cols={}; let k=0; for(const b of P){ if(!(b.c in cols)) cols[b.c]= b.c==="?"?SRC_COL[3]:SRC_COL[Math.min(k++,2)]; }
    for(const b of P) el("rect",{x:x-6,y:top+b.y0*scale,width:3.5,height:Math.max(0.6,(b.y1-b.y0)*scale),fill:cols[b.c],rx:1},svg);
    let prev=null; for(const b of P){ if(prev!==null && b.seg!==prev){ const yy=top+b.y0*scale; el("line",{x1:x-9,x2:x+w+4,y1:yy,y2:yy,stroke:"var(--orange)","stroke-width":2,"stroke-dasharray":"3 2"},svg); } prev=b.seg; }
  }

}
function spread(items,gap,minY,maxY){
  items.sort((a,b)=>a.y-b.y);
  for(let i=0;i<items.length;i++) items[i].ly=Math.max(items[i].y,i?items[i-1].ly+gap:minY);
  for(let i=items.length-1;i>=0;i--){ const lim=i<items.length-1?items[i+1].ly-gap:maxY; if(items[i].ly>lim) items[i].ly=lim; }
  return items;
}

function pendingItem(){
  const t=toolDef(), chs=benchChroms(), C=state.cuts;
  const b=(ci,k)=>{ const cut=(C[ci]||[])[k]; if(!cut) return null; return resolveBand(chs[ci],cut.name); };

  if(t.id==="i"){ const cut=(C[0]||[])[0]; return cut ? {type:"i",c:chs[0],arm:cut.arm} : null; }
  const b1=b(0,0), b2=b(0,1);
  if(t.id==="del"||t.id==="add"){ if(!b1) return null; if(t.id==="add") return {type:"add",c:chs[0],b1};
    if(!b2) return {type:"del",c:chs[0],b1}; const [x,y]=b1.mid<=b2.mid?[b1,b2]:[b2,b1]; return {type:"del",c:chs[0],b1:x,b2:y}; }
  if(!b1||!b2) return null; const [x,y]=b1.mid<=b2.mid?[b1,b2]:[b2,b1];

}
function updateInstr(){

  if(t.id==="gain"||t.id==="loss") msg+=`${t.id==="gain"?"an extra":"a missing"} chromosome ${chs[0]}. No breakpoints.`;
  else if(t.id==="i") msg+=`click the <b>p</b> or <b>q</b> arm of chr ${chs[0]}.`;
  else { const need=t.cuts.map((n,i)=>n-(have[i]||0)).reduce((a,b)=>a+b,0);
    msg += need>0 ? `click a band to place a breakpoint${t.chroms===2?" on each chromosome":""}: ${need} to go${t.id==="del"&&have[0]===1?" (or stop at one for a terminal deletion)":""}.`

function bandUnder(ci,y){

function placeCut(ci,band,replaceK){

function currentChromosomes(){
  const copies={}; for(const c of ORDER) copies[c]= c==="X" ? (state.sex==="XX"?2:1) : c==="Y" ? (state.sex==="XY"?1:0) : 2;
  const derived={}; const touched=new Set();
  for(const it of state.items){
    if(it.type==="gain"){ copies[it.c]++; touched.add(it.c); continue; }
    if(it.type==="loss"){ copies[it.c]=Math.max(0,copies[it.c]-1); touched.add(it.c); continue; }
    for(const d of chromosomesFor(it)){ (derived[d.c]=derived[d.c]||[]).push(d); }
    for(const c of involved(it)){ copies[c]=Math.max(0,copies[c]-1); touched.add(c); }
  }
  return ORDER.filter(c=>touched.has(c)).map(c=>({c,normal:copies[c],ders:derived[c]||[]}));
}
function renderResult(){
  document.getElementById("karyo").textContent=karyotypeString();

  state.items.forEach((it,i)=>{ const s=document.createElement("span"); s.className="item"; s.innerHTML=`${shortOf(it)}<button aria-label="Remove ${shortOf(it)}" title="Remove">×</button>`;
    s.querySelector("button").addEventListener("click",()=>{ state.items.splice(i,1); renderResult(); syncInput(); }); items.appendChild(s); });
  const det=document.getElementById("detail"); det.innerHTML="";
  for(const [lab,txt] of state.items.flatMap(detailedOf)){ const d=document.createElement("div"); d.innerHTML=`<span>${lab}</span> ${txt}`; det.appendChild(d); }
  const g=genesAtBreaks(); document.getElementById("genes").innerHTML = g.length ? "Genes at the breakpoints: "+g.join("; ") : "";
  drawResult();
}
function slotsOf(groups){
  const slots=[]; for(const g of groups){ for(let k=0;k<g.normal;k++) slots.push({label:g.c,segs:[SEG(g.c,0,Lbp(g.c))],normal:true});
    for(const d of g.ders) slots.push({label:d.label,segs:d.segs,ring:d.ring}); slots.push(null); }
  slots.pop(); return slots;
}
function drawResult(q=1){
  const groups=currentChromosomes(), svg=document.getElementById("resultSvg"), cv=document.getElementById("resultCv"), wrap=document.getElementById("resultWrap");

function drawScopeResult(cv,slots,wrapW,q){
  const pcs=slots.map(s=>s?piecesOf(s.segs,"850"):null), lens=pcs.map(p=>p?SCOPE.totalOf(p):0), maxU=Math.max(...lens);
  const frac=(SC.res-300)/400, cssH=Math.round(Math.max(340,Math.min(480,innerHeight-330)));
  const L1=(cssH-60)*(0.52+0.48*frac), z=Math.min(2,Math.max(1,(0.8*(cssH-50))/(maxU*L1/TOTAL1)));
  let k=L1*z/TOTAL1;
  const cens=pcs.map(p=>p?cenUnits(p):0), maxP=Math.max(...cens.filter((c,i)=>pcs[i]&&!slots[i].ring)), maxQ=Math.max(...lens.map((l,i)=>pcs[i]&&!slots[i].ring?l-cens[i]:0));
  k=Math.min(k,(cssH-44)/((maxP+maxQ)*1.08||1));
  const rad=TOTAL1*k/(27+31*frac), slotW=Math.max(rad*5.4,40), gapW=slotW*0.5;
  const needW=slots.reduce((a,s)=>a+(s?slotW:gapW),0)+slotW*0.4, cssW=Math.max(wrapW-2,Math.ceil(needW));
  const cy=14+maxP*k*1.04, items=[], labels=[];
  let x=(cssW-needW)/2+slotW*0.7;
  slots.forEach((s,i)=>{ if(!s){ x+=gapW; return; }
    items.push(s.ring ? {pieces:pcs[i],x,y:cssH/2-8,anchor:"mid",k,ring:true} : {pieces:pcs[i],x,y:cy,anchor:"cen",k,bend:0.6});
    labels.push({t:s.label,x,y:cssH-7,bold:!s.normal}); x+=slotW; });
  const sc={key:karyotypeString()+"|"+cssW+"|"+cssH,cssW,cssH,rad,items,labels};
  SCOPE.render(cv,sc,{mode:state.band,res:SC.res,focus:SC.focus,stain:SC.stain,sep:SC.sep,bend:SC.bend,het:"typical",color:SC.color,field:0.15,clean:true,seed:state.seed,q});
}

// ================= wiring =================
function syncInput(){ document.getElementById("iscnIn").value=karyotypeString(); }
function applyString(str){
  const msg=document.getElementById("iscnMsg"); const p=parseKaryotype(str);
  if(p.error){ msg.className="msg err"; msg.textContent=p.error; return false; }
  for(const it of p.items){ const e=validate({...it}); if(e && !e.startsWith("Switch")){ msg.className="msg err"; msg.textContent=`${shortOf(it)}: ${e}`; return false; } }
  state.sex=p.sex; state.items=p.items; state.cells=p.cells; syncSeg("sex",state.sex);
  msg.className="msg ok"; msg.textContent = p.count!==p.expected ? `Count ${p.count} does not match the abnormalities listed (${p.expected}).` : "";
  renderResult(); return true;
}
function syncSeg(attr,val){ document.querySelectorAll(`[data-${attr}]`).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset[attr]===val))); }
document.getElementById("iscnGo").addEventListener("click",()=>applyString(document.getElementById("iscnIn").value));
document.getElementById("iscnIn").addEventListener("keydown",e=>{ if(e.key==="Enter") applyString(e.target.value); });
const exSel=document.getElementById("examples");
for(const [group,list] of PRESETS){ const og=document.createElement("optgroup"); og.label=group;
  for(const [lab,note,str] of list) og.appendChild(new Option(`${str.replace(/^\d+,[XY]*,/,"")} · ${lab} · ${note}`,str));
  exSel.appendChild(og); }
exSel.addEventListener("change",()=>{ if(!exSel.value) return; document.getElementById("iscnIn").value=exSel.value; applyString(exSel.value); exSel.value=""; });
const tools=document.getElementById("tools");
for(const t of TOOLS){ const b=document.createElement("button"); b.className="chip"; b.dataset.tool=t.id; b.title=`${t.name} · ${t.hint}`; b.setAttribute("aria-label",t.name);
  b.textContent={t:"t",der:"der",del:"del",dup:"dup",inv:"inv",i:"i",r:"r",add:"add",gain:"+",loss:MINUS}[t.id];
  b.setAttribute("aria-pressed",String(t.id===state.tool));
  b.addEventListener("click",()=>{ state.tool=t.id; state.cuts={}; tools.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); syncPickers(); renderBench(); }); tools.appendChild(b); }
const pickA=document.getElementById("pickA"), pickB=document.getElementById("pickB");
for(const c of ORDER){ pickA.add(new Option(c,c)); pickB.add(new Option(c,c)); }
function syncPickers(){ pickA.value=state.pick[0]; pickB.value=state.pick[1]; document.getElementById("pickBWrap").hidden = toolDef().chroms!==2; }
pickA.addEventListener("change",()=>{ state.pick[0]=pickA.value; state.cuts={}; renderBench(); });
pickB.addEventListener("change",()=>{ state.pick[1]=pickB.value; state.cuts[1]=[]; renderBench(); });
document.querySelectorAll("[data-lvl]").forEach(b=>b.addEventListener("click",()=>{ state.level=b.dataset.lvl; syncSeg("lvl",state.level);
  // keep breakpoints: map each to the band containing its midpoint at the new level
  const chs=benchChroms(); for(const ci in state.cuts) state.cuts[ci]=state.cuts[ci].map(cut=>{ const r=resolveBand(chs[ci],cut.name); const nb=bandAt(chs[ci],state.level,r?r.mid:0); return {name:nb[0],arm:nb[0][0]}; });
  renderBench(); drawResult(); }));
document.getElementById("clearCuts").addEventListener("click",()=>{ state.cuts={}; renderBench(); });
document.getElementById("commit").addEventListener("click",()=>{ const it=pendingItem(); if(!it||validate(it)) return; state.items.push(it); state.cuts={}; renderBench(); renderResult(); syncInput(); document.getElementById("iscnMsg").textContent=""; });
document.querySelectorAll("[data-sex]").forEach(b=>b.addEventListener("click",()=>{ state.sex=b.dataset.sex; if(state.sex==="XX") state.items=state.items.filter(it=>!involved(it).includes("Y")); syncSeg("sex",state.sex); renderResult(); syncInput(); renderBench(); }));
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{ state.view=b.dataset.view; syncSeg("view",state.view); drawResult(); }));
document.querySelectorAll("[data-band]").forEach(b=>b.addEventListener("click",()=>{ state.band=b.dataset.band; SITE.store.set("mode",state.band); syncSeg("band",state.band); renderBench(); drawResult(); }));
document.getElementById("respread").addEventListener("click",()=>{ state.seed=1+Math.floor(Math.random()*9999); drawResult(); });
const WORDS={sRes:v=>`~${v}`, sFocus:v=>v<0.4?"sharp":v<1.2?"good":v<2.2?"soft":"blurred", sStain:v=>v<0.8?"light":v<1.2?"normal":v<1.45?"heavy":"over",
  sSep:v=>v<0.2?"closed":v<0.7?"open":"wide", sBend:v=>v<0.15?"straight":v<0.6?"some":"strong"};
const KEYS={sRes:"res",sFocus:"focus",sStain:"stain",sSep:"sep",sBend:"bend"};
for(const id in KEYS){ const inp=document.getElementById(id), out=document.getElementById(id+"Out");
  const upd=()=>{ SC[KEYS[id]]=parseFloat(inp.value); out.textContent=WORDS[id](SC[KEYS[id]]); }; upd();
  SCOPE.bindPreview(inp,upd,q=>drawResult(q)); }
document.querySelectorAll("[data-color]").forEach(b=>b.addEventListener("click",()=>{ SC.color=b.dataset.color; syncSeg("color",SC.color); drawResult(); }));
document.getElementById("resetAll").addEventListener("click",()=>{ state.items=[]; state.cells=null; renderResult(); syncInput(); });
document.getElementById("copyBtn").addEventListener("click",async e=>{ const t=karyotypeString(); try{ await navigator.clipboard.writeText(t); e.target.textContent="Copied"; }catch(_){ const r=document.createRange(); r.selectNodeContents(document.getElementById("karyo")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); e.target.textContent="Selected"; } setTimeout(()=>e.target.textContent="Copy",1400); });
let rw=0; new ResizeObserver(()=>{ const w=document.getElementById("resultWrap").clientWidth; if(Math.abs(w-rw)>4){ rw=w; renderBench(); drawResult(); } }).observe(document.getElementById("resultWrap"));

syncSeg("band",state.band); syncPickers();
// #k=<karyotype> opens a karyotype (used by links from the FISH page)
function fromHash(){ const hk=(location.hash||"").match(/^#k=(.+)$/); if(hk){ try{ document.getElementById("iscnIn").value=decodeURIComponent(hk[1]); }catch(e){} return true; } return false; }
fromHash(); window.addEventListener("hashchange",()=>{ if(fromHash()) applyString(document.getElementById("iscnIn").value); });
applyString(document.getElementById("iscnIn").value);
// preload the bench with the same translocation so the first view shows how cutting works
state.cuts={0:[{name:"q34.1",arm:"q"}],1:[{name:"q11.2",arm:"q"}]};
renderBench();
</script>
