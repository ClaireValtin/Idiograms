<title>Idiograms</title>
<style>/*__SHARED_CSS__*/
.kg{padding:8px 10px 4px;overflow-x:auto}
.kg-row{display:flex;align-items:flex-start;justify-content:safe center;gap:14px;min-width:min-content;padding-top:12px}
.kg-group{display:flex;align-items:flex-start;gap:2px;border-top:1px solid var(--line);padding-top:3px;position:relative}
.kg-group::before{content:attr(data-g);position:absolute;top:-1px;left:0;transform:translateY(-100%);font:10px var(--f-mono);color:var(--muted)}
.kg-chr{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:1px solid transparent;border-radius:4px;padding:2px 2px 1px;cursor:pointer}
.kg-chr:hover{background:var(--accent-soft)}
.kg-chr[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kg-chr span{font:500 10.5px var(--f-mono)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;align-items:start}
@media (max-width:880px){.main{grid-template-columns:minmax(0,1fr)}}
.plate{padding:8px 6px 6px;min-width:0}
.plate-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin:0 6px 4px}
.plate-head h2{font-size:17px;margin:0;letter-spacing:-.01em}
.plate-scroll{overflow-x:auto}
.plate-inner{display:flex;justify-content:space-around;gap:4px;min-width:min-content}
.level{display:flex;flex-direction:column;align-items:center}
.level h3{font:600 13px var(--f-body);margin:0}
.level .sub{font:11px var(--f-mono);color:var(--muted)}
svg text{font-family:var(--f-mono)}
.band{cursor:pointer}
.band.hl{stroke:var(--hl);stroke-width:2.5px}
.lbl{font-size:10.5px;fill:var(--muted)}
.lbl.hl{fill:var(--fg);font-weight:500}
.lead{stroke:var(--line);stroke-width:1;fill:none}
.lead.hl{stroke:var(--hl)}
.gene{font-size:10px;fill:var(--green);cursor:default}
.gene-tick{stroke:var(--green);stroke-width:1.5}
.panel{padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:60px}
@media (max-width:880px){.panel{position:static}}
.panel h3{margin:0;font-size:20px;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:500 11.5px var(--f-mono);padding:1px 7px;border-radius:4px;border:1px solid var(--line)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px}
.warn{font-size:12.5px;color:var(--muted);border-left:2px solid var(--gvar);padding-left:8px;margin:0}
.search{display:flex;gap:6px;align-items:center;margin-left:auto}
.search input{width:200px}
.search .msg{font-size:12px;color:var(--orange)}
.go{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--fg);background:var(--surface);white-space:nowrap}
.go:hover{border-color:var(--muted)}
@media (max-width:700px){.search{margin-left:0;width:100%}.search input{flex:1}}
</style>
<!--__NAV__-->
<main class="page">
  <div class="card bar" role="group" aria-label="Display options">
    <div class="seg" role="group" aria-label="Banding">
      <button data-mode="R" aria-pressed="true">R-banding</button>
      <button data-mode="G" aria-pressed="false">G-banding</button>
    </div>
    <div class="grp"><span class="lab">Karyogram</span>
      <button class="chip kgl" data-lv="400" aria-pressed="true">400</button><button class="chip kgl" data-lv="550" aria-pressed="false">550</button><button class="chip kgl" data-lv="850" aria-pressed="false" title="GRCh38, closest to ISCN 700">~700</button>
    </div>
    <div class="grp"><span class="lab">Detail</span>
      <button class="chip lvc" data-lv="400" aria-pressed="true">400</button><button class="chip lvc" data-lv="550" aria-pressed="true">550</button><button class="chip lvc" data-lv="850" aria-pressed="true" title="GRCh38, closest to ISCN 700">~700</button>
    </div>
    <label class="toggle"><input type="checkbox" id="showGenes" checked><span>Genes</span></label>
    <form class="search" id="search" role="search">
      <input type="search" id="q" placeholder="Band or gene: 9q34, ABL1" aria-label="Find a band or gene" autocomplete="off" spellcheck="false">
      <button class="btn-sec" type="submit">Go</button><span class="msg" id="qmsg" aria-live="polite"></span>
    </form>
  </div>

  <section class="card kg" aria-label="Karyogram"><div class="kg-row" id="kg"></div></section>

  <div class="main">
    <div class="card plate">
      <div class="plate-head"><h2 id="plateTitle">Chromosome 1</h2>
        <div class="grp"><a class="go" id="simLink" href="__HREF:simulator.html__">Microscope ›</a><a class="go" id="fishLink" href="__HREF:fish.html__">FISH probes ›</a></div></div>
      <div class="plate-scroll"><div class="plate-inner" id="plate"></div></div>
    </div>
    <aside class="card panel" aria-live="polite">
      <div id="info"></div>
      <div class="legend" id="legend"></div>
    </aside>
  </div>
</main>
<!--__FAQ__-->
<script>
/*__SHARED_JS__*/
const DATA = __DATA__;
const GENES = __GENES__;
const ORDER = SITE.ORDER;
const GROUPS = [["A",["1","2","3"]],["B",["4","5"]],["C",["6","7","8","9","10","11","12","X"]],["D",["13","14","15"]],["E",["16","17","18"]],["F",["19","20"]],["G",["21","22","Y"]]];
const TOP = 16, CW = 28;
const LVNAME = lv => lv==="850" ? "~700" : lv;   // data key "850" holds the GRCh38 idiogram (ISCN 2024: best fits the 700-band level)
const state = {chr:SITE.initialChr("1"), levels:new Set(["400","550","850"]), kgLevel:"400", mode:SITE.store.get("mode","R")==="G"?"G":"R", showGenes:true, sel:null};

const R_FILL = s => s==="gneg"?"var(--ink)":s==="gpos25"?"var(--r25)":s==="gpos50"?"var(--r50)":s==="gpos75"?"var(--r75)":s==="acen"?"var(--acen)":s==="gvar"?"url(#hatch)":s==="stalk"?"var(--stalk)":"var(--paper)";
const G_FILL = s => s==="gneg"?"var(--paper)":s==="gpos25"?"var(--g25)":s==="gpos50"?"var(--g50)":s==="gpos75"?"var(--g75)":s==="acen"?"var(--acen)":s==="gvar"?"url(#hatch)":s==="stalk"?"var(--stalk)":"var(--ink)";
const R_DESC = s => s==="gneg"?"R-positive (dark)":s==="gpos25"?"Intermediate":s==="gpos50"?"Weakly stained":s==="gpos75"?"Faint":s==="acen"?"Centromere":s==="gvar"?"Variable heterochromatin":s==="stalk"?"Stalk (NOR)":"R-negative (pale)";
const G_DESC = s => s==="gneg"?"G-negative (pale)":s==="gpos25"?"Faint":s==="gpos50"?"Moderate":s==="gpos75"?"Dark":s==="acen"?"Centromere":s==="gvar"?"Variable heterochromatin":s==="stalk"?"Stalk (NOR)":"G-positive (dark)";
const FILL = () => state.mode==="R" ? R_FILL : G_FILL;
const SW = (s,f) => s==="gvar"?'<span class="swatch sw-gvar"></span>':`<span class="swatch" style="background:${f(s)}"></span>`;
function renderLegend(){
  const R=state.mode==="R";
  const rows = R ? [["var(--ink)","R+ (G−)"],["var(--r25)","G gpos25"],["var(--r50)","G gpos50"],["var(--r75)","G gpos75"],["var(--paper)","R− (G gpos100)"]]
                 : [["var(--ink)","gpos100"],["var(--g75)","gpos75"],["var(--g50)","gpos50"],["var(--g25)","gpos25"],["var(--paper)","gneg"]];
  document.getElementById("legend").innerHTML = rows.map(([c,l])=>`<div><span class="swatch" style="background:${c}"></span>${l}</div>`).join("")
    + '<div><span class="swatch" style="background:var(--acen)"></span>Centromere</div><div><span class="swatch sw-gvar"></span>Heterochromatin</div><div><span class="swatch" style="background:var(--stalk)"></span>Stalk</div><div><span class="swatch" style="background:var(--green);border-color:var(--green)"></span>Gene</div>';
}
const mb = v => (v/1e6).toFixed(1);
const NS = "http://www.w3.org/2000/svg";
const el = (t,a={},p) => {const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
function addHatch(svg){
  const pat=el("pattern",{id:"hatch",width:5,height:5,patternUnits:"userSpaceOnUse",patternTransform:"rotate(45)"},el("defs",{},svg));
  el("rect",{width:5,height:5,fill:"var(--paper)"},pat); el("rect",{width:2,height:5,fill:"var(--gvar)"},pat);
}
function bpToIscn(bands,bp){ for(const b of bands){ if(bp>=b[3]&&bp<=b[4]) return b[1]+(b[2]-b[1])*(bp-b[3])/(b[4]-b[3]); } return null; }
// silhouette: follows band widths (stalks narrow, centromere pinched), rounded ends
function outline(bands,x,w,top,scale){
  const Y=v=>top+v*scale, M=x+w/2, pinch=w*0.28, stalkW=w*0.42;
  const ac=bands.filter(b=>b[5]==="acen"), cm = ac.length ? ac[0][1]+(ac[ac.length-1][2]-ac[0][1])/2 : null;
  const pts=[];
  for(const b of bands){
    const y0=b[1], y1=b[2];
    if(b[5]==="acen"){ const hw0 = y0<cm ? w/2 : pinch/2, hw1 = y1<=cm ? pinch/2 : w/2;
      if(y0<cm && y1>cm) pts.push([y0,w/2],[cm,pinch/2],[y1,w/2]); else pts.push([y0,hw0],[y1,hw1]); }
    else if(b[5]==="stalk") pts.push([y0,stalkW/2],[y1,stalkW/2]);
    else pts.push([y0,w/2],[y1,w/2]);
  }
  const total=bands[bands.length-1][2];
  const r=Math.min(w/2,(bands[0][2]-bands[0][1])*scale,9), rb=Math.min(w/2,(bands.at(-1)[2]-bands.at(-1)[1])*scale,9);
  const hwTop=pts[0][1], hwBot=pts.at(-1)[1];
  let d=`M${M-hwTop},${Y(0)+r} Q${M-hwTop},${Y(0)} ${M},${Y(0)} Q${M+hwTop},${Y(0)} ${M+hwTop},${Y(0)+r}`;
  for(const [y,hw] of pts){ const yy=Math.min(Math.max(Y(y),Y(0)+r),Y(total)-rb); d+=` L${M+hw},${yy}`; }
  d+=` L${M+hwBot},${Y(total)-rb} Q${M+hwBot},${Y(total)} ${M},${Y(total)} Q${M-hwBot},${Y(total)} ${M-hwBot},${Y(total)-rb}`;
  for(let i=pts.length-1;i>=0;i--){ const [y,hw]=pts[i]; const yy=Math.min(Math.max(Y(y),Y(0)+r),Y(total)-rb); d+=` L${M-hw},${yy}`; }
  return d+" Z";
}
function spread(items,gap,minY,maxY){
  items.sort((a,b)=>a.y-b.y);
  for(let i=0;i<items.length;i++) items[i].ly=Math.max(items[i].y, i?items[i-1].ly+gap:minY);
  for(let i=items.length-1;i>=0;i--){ const lim=i<items.length-1?items[i+1].ly-gap:maxY; if(items[i].ly>lim) items[i].ly=lim; }
  return items;
}
let uid=0;
function drawChromosome(svg,bands,x,w,top,scale,fill,attrs){
  const id="clip"+(uid++), d=outline(bands,x,w,top,scale);
  el("path",{d},el("clipPath",{id},el("defs",{},svg)));
  const g=el("g",{"clip-path":`url(#${id})`},svg);
  for(const b of bands){ const r=el("rect",{x,y:top+b[1]*scale,width:w,height:Math.max((b[2]-b[1])*scale,.5),fill:fill(b[5])},g); if(attrs) attrs(r,b); }
  el("path",{d,fill:"none",stroke:"var(--outline)","stroke-width":w<20?0.8:1.2,"stroke-linejoin":"round"},svg);
}
function detailHeight(chr){
  const n=Math.max(...[...state.levels].map(l=>DATA[chr][l].length));
  return Math.min(Math.max(Math.ceil(n*12)+20,420),800);
}
function drawLevel(chr,lv,H){
  const bands=DATA[chr][lv], total=bands.at(-1)[2], scale=H/total;
  const genes=(state.showGenes&&GENES[chr])||null;
  const geneW = genes?74:6, labW=66, W = geneW + CW + 12 + labW;
  const box=document.createElement("div"); box.className="level";
  box.innerHTML=`<h3>${LVNAME(lv)}${lv==="850"?' <span class="sub">GRCh38</span>':""}</h3><div class="sub">${bands.length} bands</div>`;
  const svg=el("svg",{width:W,height:H+TOP*2,viewBox:`0 0 ${W} ${H+TOP*2}`,role:"img","aria-label":`Chromosome ${chr}, ${state.mode}-banded, ${LVNAME(lv)} bands`},box);
  addHatch(svg);
  drawChromosome(svg,bands,geneW,CW,TOP,scale,FILL(),(r,b)=>{ r.setAttribute("class","band"); r.dataset.lv=lv; r.dataset.name=b[0]; r.setAttribute("tabindex","0"); el("title",{},r).textContent=`${chr}${b[0]}`; });
  const rx=geneW+CW;
  for(const it of spread(bands.map(b=>({b,y:TOP+((b[1]+b[2])/2)*scale})),11,TOP+4,TOP+H-2)){
    const lx=rx+20;
    el("path",{d:`M${rx+2},${it.y} L${rx+9},${it.y} L${lx-3},${it.ly}`,class:"lead","data-lv":lv,"data-name":it.b[0]},svg);
    const t=el("text",{x:lx,y:it.ly+3.5,class:"lbl","data-lv":lv,"data-name":it.b[0]},svg); t.textContent=it.b[0];
  }
  if(genes){
    const gx=geneW-4;
    for(const it of spread(genes.map(g=>({g,y:TOP+bpToIscn(bands,g.bp)*scale})),12,TOP+4,TOP+H-2)){
      const y2=TOP+bpToIscn(bands,it.g.end)*scale;
      if(y2-it.y>3) el("line",{x1:gx,x2:gx,y1:it.y,y2,class:"gene-tick"},svg); else el("line",{x1:gx-4,x2:gx,y1:it.y,y2:it.y,class:"gene-tick"},svg);
      el("path",{d:`M${gx-5},${it.y} L${gx-10},${it.ly}`,class:"lead"},svg);
      const t=el("text",{x:gx-12,y:it.ly+3.5,"text-anchor":"end",class:"gene"},svg); t.textContent=it.g.n;
      el("title",{},t).textContent=`${it.g.n} · ${it.g.band} · ${it.g.note}`;
    }
  }
  return box;
}
const cenOf = bands => { const ac=bands.filter(b=>b[5]==="acen"); return ac.length? (ac[0][1]+ac.at(-1)[2])/2 : 0; };
function renderKaryogram(){
  const kg=document.getElementById("kg"); kg.innerHTML="";
  const all=ORDER.map(c=>DATA[c][state.kgLevel]);
  const maxP=Math.max(...all.map(cenOf)), maxQ=Math.max(...all.map(b=>b.at(-1)[2]-cenOf(b)));
  const PX=Math.min(0.0125, 150/(maxP+maxQ)), w=12, rowH=(maxP+maxQ)*PX+4;
  for(const [g,cs] of GROUPS){
    const ge=document.createElement("div"); ge.className="kg-group"; ge.dataset.g=g;
    for(const c of cs){
      const bands=DATA[c][state.kgLevel];
      const btn=document.createElement("button"); btn.className="kg-chr"; btn.dataset.chr=c;
      btn.setAttribute("aria-pressed",String(c===state.chr)); btn.setAttribute("aria-label",`Chromosome ${c}`);
      const svg=el("svg",{width:w+4,height:rowH,viewBox:`0 0 ${w+4} ${rowH}`,"aria-hidden":"true"});
      addHatch(svg); drawChromosome(svg,bands,2,w,2+(maxP-cenOf(bands))*PX,PX,FILL());
      btn.appendChild(svg);
      const s=document.createElement("span"); s.textContent=c; btn.appendChild(s);
      btn.addEventListener("click",()=>selectChr(c));
      ge.appendChild(btn);
    }
    kg.appendChild(ge);
  }
}
function render(){
  const chr=state.chr, plate=document.getElementById("plate"); plate.innerHTML="";
  document.getElementById("plateTitle").textContent=`Chromosome ${chr}`;
  document.getElementById("simLink").href="__HREF:simulator.html__#chr"+chr;
  document.getElementById("fishLink").href="__HREF:fish.html__#chr"+chr;
  const H=detailHeight(chr);
  for(const lv of ["400","550","850"]) if(state.levels.has(lv)) plate.appendChild(drawLevel(chr,lv,H));
  if(state.sel) highlight(state.sel);
}
function idleInfo(){ document.getElementById("info").innerHTML='<p class="muted" style="margin:0;font-size:13px">Hover or tap a band. The same interval is outlined at every level.</p>'; }
function selectChr(c){
  state.chr=c; state.sel=null; SITE.rememberChr(c);
  document.querySelectorAll(".kg-chr").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.chr===c)));
  render(); idleInfo();
}
const overlapping = (lv,s,e) => DATA[state.chr][lv].filter(b=>b[3]<e && b[4]>s);
function highlight(sel){
  document.querySelectorAll("#plate .hl").forEach(n=>n.classList.remove("hl"));
  if(!sel) return;
  for(const lv of state.levels) for(const b of overlapping(lv,sel.s,sel.e))
    document.querySelectorAll(`#plate [data-lv="${lv}"][data-name="${b[0]}"]`).forEach(n=>n.classList.add("hl"));
}
function showInfo(lv,name){
  const chr=state.chr, b=DATA[chr][lv].find(x=>x[0]===name); if(!b) return;
  const s=b[3], e=b[4];
  state.sel={lv,name,s,e}; highlight(state.sel);
  const others=["400","550","850"].filter(l=>l!==lv).map(l=>`<dt>${LVNAME(l)}</dt><dd>${overlapping(l,s,e).map(x=>x[0]).join(", ")}</dd>`).join("");
  const gl=(GENES[chr]||[]).filter(g=>g.end>=s && g.bp<=e).map(g=>`<b>${g.n}</b> <span class="muted">${g.note}</span>`).join("<br>");
  const warn = b[5]==="gvar" ? '<p class="warn">Heterochromatin: size and staining vary between people and methods.</p>' : b[5]==="stalk" ? '<p class="warn">NOR stalk: length and staining vary between homologues.</p>' : "";
  document.getElementById("info").innerHTML=`
    <h3>${chr}${b[0]} <span class="lab">${LVNAME(lv)}</span></h3>
    <dl class="kv" style="margin-top:8px">
      ${state.mode==="R" ? `<dt>R</dt><dd>${SW(b[5],R_FILL)}${R_DESC(b[5])}</dd><dt>G</dt><dd>${SW(b[5],G_FILL)}${G_DESC(b[5])}</dd>`
                         : `<dt>G</dt><dd>${SW(b[5],G_FILL)}${G_DESC(b[5])}</dd><dt>R</dt><dd>${SW(b[5],R_FILL)}${R_DESC(b[5])}</dd>`}
      <dt>NCBI</dt><dd><span class="pill">${b[5]}</span></dd>
      <dt>GRCh38</dt><dd>chr${chr}:${mb(s)}–${mb(e)} Mb</dd>
      <dt>Size</dt><dd>${mb(e-s)} Mb · ${b[2]-b[1]} ISCN units</dd>
      ${others}
      ${gl?`<dt>Genes</dt><dd>${gl}</dd>`:""}
    </dl>${warn}`;
}
const plate=document.getElementById("plate");
["mouseover","click","focusin"].forEach(ev=>plate.addEventListener(ev,e=>{ const t=e.target.closest(".band"); if(t) showInfo(t.dataset.lv,t.dataset.name); }));
document.querySelectorAll(".lvc").forEach(c=>c.addEventListener("click",()=>{
  const lv=c.dataset.lv;
  if(state.levels.has(lv)){ if(state.levels.size===1) return; state.levels.delete(lv); c.setAttribute("aria-pressed","false"); }
  else { state.levels.add(lv); c.setAttribute("aria-pressed","true"); }
  render();
}));
document.querySelectorAll(".kgl").forEach(c=>c.addEventListener("click",()=>{
  state.kgLevel=c.dataset.lv; document.querySelectorAll(".kgl").forEach(x=>x.setAttribute("aria-pressed",String(x===c))); renderKaryogram();
}));
function setMode(m){
  state.mode=m; SITE.store.set("mode",m);
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===m)));
  renderLegend(); renderKaryogram(); render();
  if(state.sel) showInfo(state.sel.lv,state.sel.name);
}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
document.getElementById("showGenes").addEventListener("change",e=>{state.showGenes=e.target.checked;render();});

// search: "9", "chr9", "9q34", "9q34.1", "Xp21" or a landmark gene symbol
document.getElementById("search").addEventListener("submit",e=>{
  e.preventDefault();
  const q=document.getElementById("q").value.trim(), msg=document.getElementById("qmsg"); msg.textContent="";
  if(!q) return;
  const up=q.toUpperCase().replace(/^CHR/,"");
  let m=up.match(/^(\d{1,2}|X|Y)(?:([PQ])([\d.]*))?$/);
  if(m && ORDER.includes(m[1])){
    selectChr(m[1]);
    if(m[2]){ const name=m[2].toLowerCase()+m[3];
      for(const lv of ["850","550","400"]){ if(!state.levels.has(lv)) continue;
        const b=DATA[m[1]][lv].find(x=>x[0]===name) || DATA[m[1]][lv].find(x=>x[0].startsWith(name));
        if(b){ showInfo(lv,b[0]); document.querySelector(`#plate [data-lv="${lv}"][data-name="${b[0]}"]`)?.scrollIntoView({block:"nearest",behavior:"smooth"}); return; } }
      msg.textContent="No such band";
    }
    return;
  }
  for(const c of ORDER) for(const g of (GENES[c]||[])) if(g.n.toUpperCase()===up){
    selectChr(c);
    for(const lv of ["850","550","400"]) if(state.levels.has(lv)){ const b=DATA[c][lv].find(x=>g.bp>=x[3]&&g.bp<=x[4]); if(b){ showInfo(lv,b[0]); return; } }
    return;
  }
  msg.textContent="Not found (landmark genes only)";
});
window.addEventListener("hashchange",()=>{ const c=SITE.initialChr(state.chr); if(c!==state.chr) selectChr(c); });
setMode(state.mode); idleInfo(); SITE.rememberChr(state.chr);
</script>
